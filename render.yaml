services:
  # Backend: Spring Boot
  - type: web
    name: mindsprint-backend
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JDBC_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://mindsprint-frontend.onrender.com

  # Frontend: React (Vite)
  - type: static_site
    name: mindsprint-frontend
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mindsprint-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
