spring.application.name=ai-study-coach

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/AIStudyCoachDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — override JWT_SECRET in production (min 32 characters)
# SECURITY: No default fallback — app will fail to start if JWT_SECRET is not set
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI keys — required for AI Coach feature
# Set as environment variables: GEMINI_API_KEY or OPENAI_API_KEY
# GEMINI_API_KEY=your_gemini_key_here
# OPENAI_API_KEY=your_openai_key_here

# Frontend origin — used for CORS
# FRONTEND_URL=https://your-frontend-domain.com

logging.level.org.springframework.security=INFO
logging.level.com.aistudycoach=DEBUG
logging.level.org.hibernate.SQL=INFO

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator — expose health endpoint for Docker/Kubernetes health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
