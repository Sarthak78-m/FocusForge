server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/MindSprintDB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# SMTP
spring.mail.host=${EMAIL_HOST:}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${EMAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${EMAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.email.from=${EMAIL_FROM:}

# Authentication
auth.email.verification-required=${EMAIL_VERIFICATION_REQUIRED:true}
auth.email.verification-expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:30}
auth.email.resend-cooldown-seconds=${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
auth.email.blocked-domains=${EMAIL_BLOCKED_DOMAINS:}
auth.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
auth.password-reset.cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
auth.login.window-seconds=${AUTH_LOGIN_WINDOW_SECONDS:900}
auth.login.lockout-seconds=${AUTH_LOGIN_LOCKOUT_SECONDS:900}

logging.level.org.springframework.security=INFO
logging.level.com.mindsprint=DEBUG
logging.level.org.hibernate.SQL=INFO

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never